name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Acorda e confere o site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL ainda nao definido"; exit 0; fi
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -m 60 -w "%{http_code}" "$SITE_URL/health" || true)
            echo "tentativa $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
